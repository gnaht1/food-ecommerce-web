<!-- Welcome Popup Modal -->
<div class="modal fade" id="welcomePopup" tabindex="-1" aria-labelledby="welcomePopupLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0 bg-gradient-primary text-white position-relative">
        <h5 class="modal-title text-center w-100" id="welcomePopupLabel">
          <i class="fas fa-gift me-2"></i>Welcome to Nest Mart!
        </h5>
        <button type="button" class="btn-close btn-close-white position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <!-- You can customize this content later -->
        <div class="welcome-popup-content">
          <div class="popup-icon mb-3">
            <i class="fas fa-store fa-4x text-primary"></i>
          </div>
          <h3 class="popup-title mb-3">Welcome to Our Store!</h3>
          <p class="popup-description mb-4">
            Đây là 1 website để bán nguyên liệu thô cho người dùng. Website cung cấp những tính năng như: <br>
            - User: Đăng ký, đăng nhập, tìm kiếm sản phẩm, thêm sản phẩm vào giỏ hàng, thanh toán và quản lý đơn hàng. <br>
            <strong>Add your custom content here later.</strong>
          </p>
          <div class="popup-actions">
            <button type="button" class="btn btn-primary btn-lg me-2" data-bs-dismiss="modal">
              <i class="fas fa-shopping-cart me-2"></i>Start Shopping
            </button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              <i class="fas fa-times me-2"></i>Maybe Later
            </button>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <small class="text-muted">
          <input type="checkbox" id="dontShowAgain" class="me-2">
          <label for="dontShowAgain">Don't show this again</label>
        </small>
      </div>
    </div>
  </div>
</div>
